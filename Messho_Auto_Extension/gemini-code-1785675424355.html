<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; font-family: sans-serif; padding: 10px; text-align: center; }
    button { width: 100%; padding: 8px; margin-top: 10px; background: #9c27b0; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #ccc; }
    #status { margin-top: 10px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <h3>Meesho Optimizer</h3>
  <input type="file" id="imageInput" accept="image/*">
  <button id="startBtn">Find Lowest Shipping</button>
  <div id="status">Upload an image to start</div>

  <script src="popup.js"></script>
</body>
</html>
