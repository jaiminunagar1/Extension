<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meesho Seller Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Meesho Assistant</h1>

      <label for="minPrice">Expected Min Price</label>
      <input id="minPrice" type="number" min="0" step="0.01" placeholder="e.g. 120" />

      <button id="runBtn">Run Analysis</button>
      <p id="status">Ready to analyze.</p>

      <section id="resultBox" class="hidden">
        <h2>Best Image</h2>
        <img id="resultImage" alt="Best image result" />
        <div id="resultDetails"></div>
        <button id="downloadBtn" class="secondary-btn">Download Image</button>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
